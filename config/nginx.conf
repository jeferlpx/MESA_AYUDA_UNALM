# =============================================================================
# CONFIGURACIÓN DE NGINX (REVERSE PROXY & SERVIDOR DE ARCHIVOS ESTÁTICOS)
# Ubicación típica en servidor Linux UNALM: /etc/nginx/conf.d/mesaayuda.conf
# =============================================================================

server {
    listen 80;
    server_name mesaayuda.lamolina.edu.pe localhost 172.16.0.189;

    # Redirección HTTP a HTTPS en entorno de producción institucional
    # return 301 https://$host$request_uri;

    # Configuración de logs
    access_log /var/log/nginx/mesaayuda_access.log;
    error_log /var/log/nginx/mesaayuda_error.log;

    # Tamaño máximo para subida de adjuntos (15MB)
    client_max_body_size 15M;

    # 1. Servir la aplicación React (Frontend dist)
    location / {
        root /var/www/mesa-ayuda/client/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy inverso para API REST de Node.js (Puerto 4000)
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 3. Servir directamente archivos adjuntos subidos con seguridad
    location /uploads/ {
        alias /var/www/mesa-ayuda/uploads/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff";

        # Forzar descarga para ejecutables o scripts no permitidos
        types {
            application/pdf pdf;
            image/jpeg jpg jpeg;
            image/png png;
            application/vnd.openxmlformats-officedocument.wordprocessingml.document docx;
        }
        default_type application/octet-stream;
    }
}
