# =============================================================================
# CONFIGURACIÓN DE NGINX (REVERSE PROXY & SERVIDOR DE ARCHIVOS ESTÁTICOS CON SSL)
# Ubicación típica en servidor Linux UNALM: /etc/nginx/conf.d/mesaayuda.conf
# =============================================================================

# 1. Redirección HTTP -> HTTPS
server {
    listen 80;
    server_name mesadeayuda-test.lamolina.edu.pe mesadeayuda.lamolina.edu.pe *.lamolina.edu.pe;

    return 301 https://$host$request_uri;
}

# 2. Servidor HTTP por defecto (Acceso directo por IP)
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 30M;
    access_log /var/log/nginx/mesaayuda_access.log;
    error_log /var/log/nginx/mesaayuda_error.log;

    location / {
        root /var/www/mesa-ayuda/client/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /uploads/ {
        alias /var/www/mesa-ayuda/uploads/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff";
    }
}

# 3. Servidor Seguro HTTPS (Puerto 443)
server {
    listen 443 ssl;
    http2 on;
    server_name mesadeayuda-test.lamolina.edu.pe mesadeayuda.lamolina.edu.pe *.lamolina.edu.pe localhost 172.16.20.49;

    # Certificados SSL Institucionales
    ssl_certificate /var/www/mesa-ayuda/ssl/fullchain.crt;
    ssl_certificate_key /var/www/mesa-ayuda/ssl/private.key;

    # Parámetros de Seguridad SSL / TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Cabeceras de Seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Configuración de logs y tamaño
    access_log /var/log/nginx/mesaayuda_ssl_access.log;
    error_log /var/log/nginx/mesaayuda_ssl_error.log;
    client_max_body_size 30M;

    # 1. Servir Frontend React
    location / {
        root /var/www/mesa-ayuda/client/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy inverso para API REST
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }

    # 3. Servir archivos adjuntos
    location /uploads/ {
        alias /var/www/mesa-ayuda/uploads/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff";
    }
}
