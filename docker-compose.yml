services:
  db:
    image: mysql:8.0
    container_name: mesaayuda-db-test
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootTest2026$
      MYSQL_DATABASE: mesaayuda_test_db
      MYSQL_USER: user_helpdesk_test
      MYSQL_PASSWORD: ayudaTest2026$
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --character-set-client-handshake=FALSE --init_connect='SET NAMES utf8mb4'
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./config/init-db:/docker-entrypoint-initdb.d:ro
    networks:
      - red_mesa_ayuda

  backend:
    build: ./server
    container_name: mesaayuda-backend
    restart: always
    networks:
      - red_mesa_ayuda
    env_file:
      - .env
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "4000:4000"
    depends_on:
      - db

  frontend:
    build: ./client
    container_name: mesaayuda-frontend
    restart: always
    networks:
      - red_mesa_ayuda
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend

networks:
  red_mesa_ayuda:
    driver: bridge
    ipam:
      config:
        - subnet: 10.200.0.0/24

volumes:
  uploads_data:
  db_data:
