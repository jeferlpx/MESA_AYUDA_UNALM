# =============================================================================
# CONFIGURACIÓN NGINX: MESA DE AYUDA UNALM (HTTP / HTTPS DUAL CON REDIRECCIÓN)
# =============================================================================

# 1. Redirección automática HTTP (80) -> HTTPS (443) para dominios institucionales
server {
    listen 80;
    listen [::]:80;
    server_name mesadeayuda-test.lamolina.edu.pe mesadeayuda.lamolina.edu.pe *.lamolina.edu.pe;

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Servidor HTTP (80) por defecto para acceso directo por IP / intranet sin certificado
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 30M;

    # Servir Frontend estático (React SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso para API REST de Node.js
    location /api/ {
        proxy_pass http://mesaayuda-backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirigir archivos adjuntos al Backend
    location /uploads/ {
        proxy_pass http://mesaayuda-backend:4000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Compatibilidad con rutas /app/uploads/
    location /app/uploads/ {
        proxy_pass http://mesaayuda-backend:4000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}

# 3. Servidor Seguro HTTPS (443) con Certificado Oficial UNALM (*.lamolina.edu.pe)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mesadeayuda-test.lamolina.edu.pe mesadeayuda.lamolina.edu.pe *.lamolina.edu.pe localhost 172.16.20.49;

    # Certificados SSL / TLS Institucionales
    ssl_certificate /etc/nginx/ssl/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/private.key;

    # Protocolos y Ciphers seguros (TLSv1.2 y TLSv1.3)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Cabeceras de seguridad HTTP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Tamaño máximo de adjuntos (imágenes, PDFs, etc.)
    client_max_body_size 30M;

    # Servir Frontend estático (React SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso para API REST de Node.js
    location /api/ {
        proxy_pass http://mesaayuda-backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Servir y redirigir archivos adjuntos al Backend
    location /uploads/ {
        proxy_pass http://mesaayuda-backend:4000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Compatibilidad con rutas /app/uploads/
    location /app/uploads/ {
        proxy_pass http://mesaayuda-backend:4000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
