        <h1 style="color: #006837; font-size: 1.85rem; font-weight: 800; margin-bottom: 0.75rem;">Mesa de Ayuda UNALM — Oficina de Tecnologías de la Información y Comunicaciones (OTIC)</h1>
        <p style="font-size: 1rem; color: #334155;">Bienvenido al portal oficial de <strong>Mesa de Ayuda de la Universidad Nacional Agraria La Molina (UNALM)</strong>.</p>
        <p style="color: #475569;">Este sistema centraliza la gestión y resolución de solicitudes y requerimientos técnicos alineados al estándar internacional ITIL v4 y al Reglamento de Organización y Funciones (ROF) de la UNALM:</p>
        <ul style="color: #1e293b; padding-left: 1.5rem; margin: 1rem 0;">
          <li><strong>Soporte Técnico de TI:</strong> Reparación de hardware, soporte de software institucional, mantenimiento de redes cableadas e inalámbricas Wi-Fi campus.</li>
          <li><strong>Directorio Activo y Cuentas:</strong> Gestión de correos institucionales (@lamolina.edu.pe), credenciales de acceso institucional y autenticación centralizada.</li>
          <li><strong>Mantenimiento y Servicios Generales:</strong> Órdenes de trabajo, inventario técnico e inspecciones preventivas SIGI.</li>
          <li><strong>Trazabilidad y Calidad:</strong> Consulta de estado de requerimientos en tiempo real y encuestas de satisfacción de servicio.</li>
        </ul>
        <p style="color: #64748b; font-size: 0.875rem;">Para acceder a la plataforma interactiva, por favor habilite JavaScript en su navegador web o comuníquese directamente con la OTIC al correo institucional <strong>redes@lamolina.edu.pe</strong>.</p>
